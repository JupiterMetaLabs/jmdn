# JMDN Node — Docker Compose
#
# Services:
#   postgres       — ThebeDB SQL projection (wal_level=logical for CDC)
#   redis          — account sync worker queue (Redis Streams)
#   jmdn           — the JMDN node process (non-root via gosu)
#   jmdn-bootstrap — one-time GCS snapshot download (profile-gated)
#
# Storage: ThebeDB KV (BadgerDB) is embedded in the jmdn process; the SQL
# projection lives in the postgres service.
#
# Volume layout (mirrors bare-metal install_services.sh):
#   postgres-data → /var/lib/postgresql/data   ThebeDB SQL projection
#   jmdn-state    → /opt/jmdn                  jmdn WorkingDirectory (DB/, storage/, config/, certs/)
#   redis-data    → /data                      Redis AOF log
#
# First run:
#   docker compose run --rm jmdn-bootstrap   # populate chain data once
#   docker compose up -d
#
# Subsequent runs:
#   docker compose up -d
#
# Force re-bootstrap (wipes chain data):
#   docker compose down -v
#   docker compose run --rm jmdn-bootstrap
#   docker compose up -d

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # ThebeDB SQL projection target. wal_level=logical is required for the
  # ThebeDB CDC (WAL consumer). Host port 5430 matches Scripts tooling.
  postgres:
    image: postgres:16-alpine
    container_name: jmdn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jmdn
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-jmdndefault}"
      POSTGRES_DB: jmdn
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    ports:
      - "5430:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmdn -d jmdn"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Account sync worker queue (Redis Streams XADD/XREADGROUP/XACK).
  # Decouples WriteAccounts from synchronous DB commit latency.
  redis:
    image: redis:7-alpine
    container_name: jmdn-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-jmdnredissync}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-jmdnredissync}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Bootstrap (one-time) ──────────────────────────────────────────────────
  # Downloads the chain snapshot from GCS and populates node state.
  # Guard: writes .bootstrapped sentinel — safe to call again (skips if done).
  #   docker compose run --rm jmdn-bootstrap
  jmdn-bootstrap:
    image: ghcr.io/jupitermetalabs/jmdn:latest
    container_name: jmdn-bootstrap
    profiles: [bootstrap]
    user: root
    entrypoint: ["/usr/local/bin/bootstrap_sync.sh"]
    volumes:
      - jmdn-state:/opt/jmdn
    environment:
      GCS_BUCKET: "${GCS_BUCKET:-jmzk-releases}"
      GCS_PREFIX: "${GCS_PREFIX:-jmdn_bootstrap_2306}"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── JMDN Node ─────────────────────────────────────────────────────────────
  # Entrypoint runs as root (creates dirs, generates certs), then gosu-drops
  # to jmdn user. ThebeDB KV (BadgerDB) lives in the node's state volume;
  # the SQL projection connects to the postgres service via THEBE_SQL_DSN.
  #
  # WorkingDirectory = /opt/jmdn (matches bare-metal ${JMDN_DATA}).
  # DB/gossipnode.db resolves as ./DB/gossipnode.db relative to WorkingDirectory.
  jmdn:
    image: ghcr.io/jupitermetalabs/jmdn:latest
    container_name: jmdn
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8545:8545"   # JSON-RPC (Ethereum-compatible) — primary exchange endpoint
      - "8546:8546"   # WebSocket RPC
      - "15052:15052" # DID service
      # Explorer API — localhost-bound by default, auth-protected.
      # Uncomment to expose (set JMDN_SECURITY_EXPLORER_API_KEY first):
      # - "8090:8090"

    environment:
      # ThebeDB SQL projection — Docker internal DNS to the postgres service.
      # Overrides the yaml sql_dsn (Viper env > yaml).
      THEBE_SQL_DSN: "postgres://jmdn:${POSTGRES_PASSWORD:-jmdndefault}@postgres:5432/jmdn?sslmode=disable"

      # Redis container reads REDIS_PASSWORD directly; jmdn reads it here via Viper.
      JMDN_DATABASE_REDIS_PASSWORD: "${REDIS_PASSWORD:-jmdnredissync}"

      # Explorer API key — forwarded into the container so the health check curl
      # can include the Bearer token. Set JMDN_SECURITY_EXPLORER_API_KEY in .env.
      # Must match security.explorer_api_key in jmdn.yaml.
      JMDN_SECURITY_EXPLORER_API_KEY: "${JMDN_SECURITY_EXPLORER_API_KEY:-}"

    volumes:
      # Node config — jmdn.yaml must exist next to this file (see DOCKER.md Step 3).
      - ./jmdn.yaml:/etc/jmdn/jmdn.yaml:ro

      # Node state: DB/gossipnode.db, storage/thebe-kv/, config/peer.json, certs/.
      # Matches bare-metal WorkingDirectory=${JMDN_DATA} = /opt/jmdn.
      - jmdn-state:/opt/jmdn

      # Production TLS certs (optional — self-signed generated on first run):
      # - ./certs:/opt/jmdn/certs:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/api/v1/node/version -H \"Authorization: Bearer ${JMDN_SECURITY_EXPLORER_API_KEY:-}\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres-data: # ThebeDB SQL projection
    driver: local
  jmdn-state:   # jmdn node state at /opt/jmdn (DB/, storage/, config/, certs/)
    driver: local
  redis-data:   # Redis AOF log
    driver: local
