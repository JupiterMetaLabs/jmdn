name: CI

# ── Action pinning convention (applies to every workflow in this repo) ───────
#
# Actions are referenced by EXACT version — `@v7.0.1`, never `@v7` and never a
# bare commit SHA. Two things make that safe, and neither is optional:
#
#   1. .github/workflows/actions.lock — the workflow dependency lockfile. It
#      records the commit each ref resolved to, covers TRANSITIVE action
#      dependencies, and stores the source repo's owner_id/repo_id so Actions
#      verifies at run time that the repository behind the name is still the one
#      we locked. Generated by `gh actions-lock`; never edit it by hand.
#      Regenerate it in the same commit as any version bump here.
#
#   2. A watcher that raises the version bumps, so pinning does not mean going
#      stale — without one this repo drifted 1-4 majors behind. NOT YET IN
#      PLACE: Dependabot reads .github/dependabot.yml only from the DEFAULT
#      branch (main), so it has to land there, not here. Until it does, bumping
#      these refs is a manual job: `gh actions-lock` after each change, and a
#      periodic sweep of the pinned versions below.
#
# WHY NOT A BARE MAJOR (`@v7`). A tag is a moving pointer. In CVE-2025-30066 an
# attacker with a compromised maintainer token repointed EXISTING tags of
# tj-actions/changed-files — exact ones included — at a commit that dumped CI
# secrets into build logs. Every repo on a tag ran it on its next build.
#
# WHY NOT A RAW SHA EITHER. That was GitHub's recommendation before lockfiles
# existed, and it is the correct fallback if the lockfile is ever dropped. The
# lockfile supersedes it: it covers transitive deps, verifies repo identity, and
# keeps these files readable. See
# docs.github.com/actions/concepts/security/workflow-dependency-lockfiles
#
# If you add an action: use an exact version, then run `gh actions-lock`.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["main", "v3base", "release/**"]
  pull_request:
    branches: ["main", "v3base", "release/**"]

# Cancel any in-progress run for the same branch when a new push arrives.
# This avoids wasting runner minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the linter version.
  # Update here when you upgrade golangci-lint locally.
  GOLANGCI_LINT_VERSION: v2.15.0
  # sha256 of that release's install.sh, checked before it is executed. See the
  # install step in quality-gate for why the version pin alone is not enough.
  GOLANGCI_LINT_INSTALLER_SHA256: 1022ddb4d87ed252350ed03fc9677e250a4ae95cc6bcd4658c2a20a8a23d390f
  # Keep in step with nightly.yml, which pins the same tool.
  GOVULNCHECK_VERSION: v1.9.0
  # The extension that generates and verifies .github/workflows/actions.lock.
  # Regenerate the lockfile locally with this same version.
  GH_ACTIONS_LOCK_VERSION: v0.4.1

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # actions/checkout writes GITHUB_TOKEN into .git/config by default,
          # leaving it readable by every later step. Nothing here needs it.
          persist-credentials: false
          # Required by the telemetry gate below: --new-from-rev resolves the PR
          # base SHA, which a shallow clone does not contain. Without this the
          # step hits its skip branch on every run and silently enforces nothing.
          fetch-depth: 0

      # Reads the version from go.mod, so there is no duplication here. Note
      # WHICH line it reads: setup-go v6 and later prefer the `toolchain`
      # directive and fall back to `go` only when it is absent. That matters —
      # go.mod declares `go 1.27.0` (the language floor) and `toolchain
      # go1.27.4` (the compiler that must build this, because go1.27.4 carries
      # the fix for GO-2026-6859, an HTTP/1 crash reachable from our public RPC
      # surface). On setup-go v5 this step installed 1.27.0 and only reached
      # 1.27.4 via Go's own toolchain auto-download; from v6 it installs 1.27.4
      # directly. Do not "simplify" go.mod by dropping the toolchain line.
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # Installed once; both the format check and the lint step below use this
      # binary.
      #
      # The private-modules token is never written to git config. The fetch
      # step below passes it to git through GIT_CONFIG_* variables that exist
      # only inside that step, downloads every module, and exits; no later step
      # (build, tests, linters, tool installs) can read it. Anything a later
      # step needs and the cache lacks fails with an auth error instead of being
      # fetched quietly. Keep it that way: never `git config --global` the token.
      #
      # The fetch is also pinned by CONTENT, not just by tag. A tag is a moving
      # pointer — the same property the convention note at the top of ci.yml
      # refuses to rely on for actions — so the version pin alone would not
      # survive a repointed tag. install.sh then verifies the binary it
      # downloads against the release's own checksums file.
      #
      # To bump: change GOLANGCI_LINT_VERSION, then
      #   curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/<ver>/install.sh | sha256sum
      # and put the result in GOLANGCI_LINT_INSTALLER_SHA256. Both move together
      # or the step fails closed.
      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        env:
          VERSION: ${{ env.GOLANGCI_LINT_VERSION }}
          INSTALLER_SHA256: ${{ env.GOLANGCI_LINT_INSTALLER_SHA256 }}
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/golangci-install.sh \
            "https://raw.githubusercontent.com/golangci/golangci-lint/${VERSION}/install.sh"
          echo "${INSTALLER_SHA256}  /tmp/golangci-install.sh" | sha256sum -c -
          sh /tmp/golangci-install.sh -b "$(go env GOPATH)/bin" "${VERSION}"

      - name: Fetch Go modules (token visible to this step only)
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          # go.mod requires two private repos - ThebeDB and avc. Without this
          # token the run does not fail here; it dies two steps later inside
          # `go mod verify` with "could not read Username for
          # 'https://github.com'", which reads as a network fault rather than a
          # missing secret. Fail at the step that owns the condition, with a
          # message that names it. Forks are never given secrets, so a fork PR
          # stops here by design.
          if [ -z "$GO_MODULES_TOKEN" ]; then
            echo "::error::GO_MODULES_TOKEN is not set. go.mod requires the private modules github.com/JupiterMetaLabs/ThebeDB and github.com/JupiterMetaLabs/avc. Set it under Settings -> Secrets and variables -> Actions (the other four JupiterMetaLabs modules are public and need no token)."
            exit 1
          fi
          echo "GOPRIVATE=github.com/JupiterMetaLabs/*" >> "$GITHUB_ENV"
          export GOPRIVATE="github.com/JupiterMetaLabs/*"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${GO_MODULES_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          go mod download

      # ── Dependency Integrity ────────────────────────────────────────────
      # Verifies downloaded packages match their expected checksums in go.sum.
      - name: Verify module checksums
        run: go mod verify

      # Ensures go.mod and go.sum are not out of sync with the source tree.
      # Catches the "developer forgot to run go mod tidy" case.
      - name: Check go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo ""
            echo "❌  go.mod or go.sum is out of sync."
            echo "    Run 'go mod tidy' locally and commit the result."
            exit 1
          }

      # ── Compilation ─────────────────────────────────────────────────────
      # Full compile of every package. Catches broken imports and type errors
      # before the linter runs (cheaper feedback loop).
      - name: Build
        run: go build ./...

      # ── Formatting ──────────────────────────────────────────────────────
      # Driven entirely by the `formatters:` block in .golangci.yml.
      # Adding or removing a formatter in .golangci.yml automatically
      # changes what this step enforces — no changes needed here.
      - name: Format check
        run: |
          golangci-lint fmt --diff || {
            echo ""
            echo "❌  Formatting issues found."
            echo "    Run 'golangci-lint fmt' locally and commit the result."
            exit 1
          }

      # ── Linting ─────────────────────────────────────────────────────────
      # Driven entirely by the `linters:` block in .golangci.yml.
      # Plug-and-play: enable or disable a linter in .golangci.yml and
      # CI automatically picks it up on the next push — no changes needed here.
      #
      # ┌─ CHOOSE ONE MODE ──────────────────────────────────────────────────┐
      #
      # MODE A — Full enforcement (clean codebase, zero backlog tolerated)
      # Use this when the entire codebase is lint-clean.
      # Every violation in every file fails the build.
      #
      # MODE B — Diff-only enforcement (backlog exists, protect going forward)
      # Use this to block NEW lint issues without being blocked by old ones.
      # --new-from-rev=HEAD~1 compares the PR diff against its parent commit.
      # Only violations introduced by THIS commit will fail the build.
      # Switch to Mode A once the backlog is cleared.
      #
      # └────────────────────────────────────────────────────────────────────┘
      - name: Lint
        run: |
          # MODE A: uncomment the line below and comment out MODE B to enforce the full codebase.
          golangci-lint run

          # MODE B: uncomment the line below and comment out MODE A to enforce diff-only.
          # golangci-lint run --new-from-rev=HEAD~1

      # ── Telemetry conventions (new code only) ────────────────────────────
      # Separate config (.golangci-telemetry.yml) and separate step, so the
      # existing backlog never blocks this and this never destabilises the
      # Lint step above. Full-tree tracking lives in nightly.yml's static job.
      #
      # BLOCKING. A new zerolog/zap import, a new zerolog call, or a new
      # fmt.Print*/Fprint* fails the build.
      #
      # Existing violations are untouched: --new-from-rev inspects only CHANGED
      # lines, so the ~835 already in the tree are invisible here. They are
      # removed by the migration, not by this gate.
      #
      # Escape hatch, enforced by nolintlint (needs a named linter AND a reason):
      #     //nolint:forbidigo // CLI output: <why this one is terminal output>
      #
      # Rationale, evidence and the validation record: docs/telemetry/VALIDATION.md
      - name: Telemetry conventions (new code only)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::no diff base available (first push on this branch); skipping"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # A base that exists but is absent from the clone is a
            # misconfiguration, not a legitimate first push — that case is
            # handled above. Exiting 0 here would report success for a run that
            # never happened, so it fails loudly instead. The gate is blocking, so a
            # broken fetch-depth stops PRs rather than silently enforcing nothing,
            # which is the right outcome for a check that cannot do its job.
            echo "::error::diff base $BASE not present in the clone; checkout needs fetch-depth: 0"
            exit 1
          fi
          golangci-lint run \
            --config .golangci-telemetry.yml \
            --new-from-rev "$BASE"

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    # On pull_request events the action lists the PR's commits via the API
    # (GET /pulls/{n}/commits), which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # actions/checkout writes GITHUB_TOKEN into .git/config by default,
          # leaving it readable by every later step. Nothing here needs it.
          persist-credentials: false
          fetch-depth: 0
      # gitleaks-action needs a licence for organization repos: GITLEAKS_LICENSE
      # is a repository or organization secret. v3 runs on Node 24.
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # WHY THIS IS NOT AN IMAGE SCAN. A per-PR gate must fail only for something
  # the PR's author did, and only for something they can fix in that PR. An
  # image scan fails neither test: the Debian CVEs it finds are not caused by
  # the diff, and whether it passes depends on the day Trivy's vulnerability
  # database was published, not on the commit. A gate that goes red on an
  # unchanged PR is how a team learns to click through red.
  #
  # What IS the author's doing is pulling in code with a known vulnerability
  # that this repository actually reaches. govulncheck in SOURCE mode answers
  # exactly that, from go.mod and the call graph, with no image to build.
  #
  # The image scan lives where the image lives: nightly.yml builds and scans it
  # on every push to v3base (advisory, Security job), and docker.yml scans each
  # architecture by digest BEFORE the manifest is tagged (blocking) — see the
  # scan-digests job there.
  deps:
    name: Dependencies (govulncheck)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # actions/checkout writes GITHUB_TOKEN into .git/config by default,
          # leaving it readable by every later step. Nothing here needs it.
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch Go modules (token visible to this step only)
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [ -z "$GO_MODULES_TOKEN" ]; then
            echo "::error::GO_MODULES_TOKEN is not set; go.mod requires the private JupiterMetaLabs modules."
            exit 1
          fi
          export GOPRIVATE="github.com/JupiterMetaLabs/*"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${GO_MODULES_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          go mod download
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      # SOURCE mode, and BLOCKING. This reports only vulnerabilities REACHABLE
      # from our code, which is the set a PR author can act on, and it is green
      # on this head — so it is a gate that can actually fail rather than a
      # green tick that enforces nothing.
      #
      # `-scan=module` (every module in go.mod, reachable or not) stays in
      # nightly as an advisory report. It is not green here: GO-2026-5932
      # (x/crypto openpgp) has zero importers and its only fix is a pre-release
      # pseudo-version, so gating on it would block every PR for a vulnerability
      # nothing can reach. Note the flag spelling — `module` is a -scan level,
      # not a -mode; `-mode=module` is rejected outright.
      - name: govulncheck (reachable vulnerabilities)
        run: govulncheck ./...

  # actions.lock is the only pin on the actions every workflow runs (see the
  # convention note at the top of this file), so a workflow edit that is not
  # followed by `gh actions-lock` leaves an action unpinned or, once the
  # workflow is enforced, unable to start. This catches it on the pull request.
  # Make it a required check on v3base and main.
  lockfile:
    name: Action lockfile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock ${{ env.GH_ACTIONS_LOCK_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.GH_ACTIONS_LOCK_VERSION }}
        run: gh extension install github/gh-actions-lock --pin "$VERSION"
      - name: Verify actions.lock matches the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
