name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

# Cancel any in-progress run for the same branch when a new push arrives.
# This avoids wasting runner minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the linter version.
  # Update here when you upgrade golangci-lint locally.
  GOLANGCI_LINT_VERSION: v2.10.1

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the `go` directive directly from go.mod — no version duplication.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Install golangci-lint once. Both the format check and lint step below
      # will use this binary, so it is only installed once.
      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}

      # ── Dependency Integrity ────────────────────────────────────────────
      # Verifies downloaded packages match their expected checksums in go.sum.
      - name: Verify module checksums
        run: go mod verify

      # Ensures go.mod and go.sum are not out of sync with the source tree.
      # Catches the "developer forgot to run go mod tidy" case.
      - name: Check go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo ""
            echo "❌  go.mod or go.sum is out of sync."
            echo "    Run 'go mod tidy' locally and commit the result."
            exit 1
          }

      # ── Compilation ─────────────────────────────────────────────────────
      # Full compile of every package. Catches broken imports and type errors
      # before the linter runs (cheaper feedback loop).
      - name: Build
        run: go build ./...

      # ── Tests ───────────────────────────────────────────────────────────
      # -short skips integration tests that need live infra (they must gate on
      # testing.Short()); -race catches data races in the unit + consensus tests.
      # If a package fails here for lack of infra, gate that test behind
      # testing.Short() rather than re-disabling the whole step.
      - name: Test
        run: go test -short -race ./...

      # ── Formatting ──────────────────────────────────────────────────────
      # Driven entirely by the `formatters:` block in .golangci.yml.
      # Adding or removing a formatter in .golangci.yml automatically
      # changes what this step enforces — no changes needed here.
      - name: Format check
        run: |
          golangci-lint fmt --diff || {
            echo ""
            echo "❌  Formatting issues found."
            echo "    Run 'golangci-lint fmt' locally and commit the result."
            exit 1
          }

      # ── Linting ─────────────────────────────────────────────────────────
      # Driven entirely by the `linters:` block in .golangci.yml.
      # Plug-and-play: enable or disable a linter in .golangci.yml and
      # CI automatically picks it up on the next push — no changes needed here.
      #
      # ┌─ CHOOSE ONE MODE ──────────────────────────────────────────────────┐
      #
      # MODE A — Full enforcement (clean codebase, zero backlog tolerated)
      # Use this when the entire codebase is lint-clean.
      # Every violation in every file fails the build.
      #
      # MODE B — Diff-only enforcement (backlog exists, protect going forward)
      # Use this to block NEW lint issues without being blocked by old ones.
      # --new-from-rev=HEAD~1 compares the PR diff against its parent commit.
      # Only violations introduced by THIS commit will fail the build.
      # Switch to Mode A once the backlog is cleared.
      #
      # └────────────────────────────────────────────────────────────────────┘
      - name: Lint
        run: |
          # MODE A: uncomment the line below and comment out MODE B to enforce the full codebase.
          golangci-lint run

          # MODE B: uncomment the line below and comment out MODE A to enforce diff-only.
          # golangci-lint run --new-from-rev=HEAD~1

  # ── Security scanning ───────────────────────────────────────────────────
  # Additive, separate job so a security finding does not block the existing
  # quality-gate merge path. Runs on the SAME events as quality-gate (push +
  # PR to main / release/**; see the top-level `on:` block).
  #
  #   - govulncheck : known-vuln (CVE/GHSA) scan of the module + std lib.
  #                   FAILS the job on a vuln reachable from our code — this is
  #                   the one hard gate here (cheap to fix, high signal).
  #   - gosec       : static SAST ruleset. NON-BLOCKING for now
  #                   (continue-on-error) so it surfaces findings without
  #                   breaking the build; flip continue-on-error to false once
  #                   the initial backlog is triaged.
  #   - gitleaks    : secret scan. Third-party action PINNED TO A COMMIT SHA
  #                   (not a moving tag) so a compromised upstream tag cannot
  #                   silently run new code in CI.
  security:
    name: Security
    runs-on: ubuntu-latest
    # go-ethereum needs cgo; keep it on so package loading (govulncheck/gosec)
    # matches the real build (see Makefile: CGO_ENABLED=1).
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scans git history; fetch it all so old commits are covered.
          fetch-depth: 0

      # Reads the `go` directive from go.mod — same pattern as quality-gate.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ── Known-vulnerability scan (hard gate) ────────────────────────────
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      # ── Static analysis (non-blocking for now) ──────────────────────────
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        # continue-on-error: surface findings without breaking the build yet.
        # Remove this line (or set false) to make gosec a hard gate later.
        continue-on-error: true
        run: |
          # -severity medium / -confidence medium: sensible default ruleset —
          #   drops low-severity/low-confidence noise on first rollout.
          # -exclude-generated: skip *.pb.go and other generated files.
          # -exclude=G115: integer-overflow-on-conversion is extremely noisy on
          #   a codebase full of uint64<->int block-height/index conversions;
          #   drop this exclude once those sites are audited.
          gosec \
            -severity medium \
            -confidence medium \
            -exclude-generated \
            -exclude=G115 \
            ./...

      # ── Secret scan (third-party action, pinned to a commit SHA) ─────────
      # gitleaks/gitleaks-action@v2.3.9 pinned to its commit SHA.
      # NOTE: gitleaks-action requires GITLEAKS_LICENSE for ORGANIZATION-owned
      # repos (it is free only for personal public repos). Add the license as a
      # repo/org secret named GITLEAKS_LICENSE if this repo is org-owned, or
      # swap this step for the gitleaks binary (`gitleaks detect --source .`)
      # if you do not want the licensed action.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
