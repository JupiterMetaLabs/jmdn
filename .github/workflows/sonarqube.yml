name: SonarQube

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    if: false # service unavailable — re-enable when SONAR_HOST_URL is restored
    name: SonarQube Analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # actions/checkout writes GITHUB_TOKEN into .git/config by default,
          # leaving it readable by every later step. Nothing here needs it.
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # ── Coverage ─────────────────────────────────────────────────────
      # Generate cover.out for SonarQube to consume.
      # NOTE: Some test packages require live infrastructure (database,
      # seed node). If specific packages fail, exclude them here and
      # track via a separate integration test workflow.
      #
      # Uncomment when test infrastructure is available in CI:
      # - name: Run tests with coverage
      #   run: |
      #     go test ./... \
      #       -coverprofile=cover.out \
      #       -covermode=atomic \
      #       -timeout=5m

      # ── SonarQube Scan ───────────────────────────────────────────────
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ── Quality Gate ─────────────────────────────────────────────────
      # Fails the workflow if the SonarQube quality gate is red.
      # Combined with GitHub branch protection, this blocks PR merges.
      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
