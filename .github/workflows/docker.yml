name: Docker

# Triggers on version tags (v2.0.0, v2.0.1-rc1, etc.)
# Also allows manual dispatch for testing
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v2.0.0)"
        required: true
        default: "dev"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jupitermetalabs/jmdn

jobs:
  # ── Gate: nothing is published unless the tagged commit builds and passes
  # the unit tests. Mirrors the CI quality gate's build + test steps.
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Access private Go modules
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          # go.mod requires two private repos - ThebeDB and avc. Without this
          # token the run does not fail here; it dies two steps later inside
          # `go mod verify` with "could not read Username for
          # 'https://github.com'", which reads as a network fault rather than a
          # missing secret. Fail at the step that owns the condition, with a
          # message that names it. Forks are never given secrets, so a fork PR
          # stops here by design.
          if [ -z "$GO_MODULES_TOKEN" ]; then
            echo "::error::GO_MODULES_TOKEN is not set. go.mod requires the private modules github.com/JupiterMetaLabs/ThebeDB and github.com/JupiterMetaLabs/avc. Set it under Settings -> Secrets and variables -> Actions (the other four JupiterMetaLabs modules are public and need no token)."
            exit 1
          fi
          echo "GOPRIVATE=github.com/JupiterMetaLabs/*" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GO_MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -short -race ./...

  build-and-push:
    name: Build & Push (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── linux/amd64 ──────────────────────────────────────
          # Linux (x86_64), Windows (Docker Desktop / WSL2)
          - platform: linux/amd64
            runner_arch: amd64

          # ── linux/arm64 ──────────────────────────────────────
          # macOS Apple Silicon (M1/M2/M3), Raspberry Pi 4/5,
          # modern ARM SBCs (Rock Pi, Orange Pi 5, etc.)
          - platform: linux/arm64
            runner_arch: arm64


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-compilation for non-native arches)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Inputs reach the shell through env, never by template interpolation
      # into the script, and must look like an image tag.
      - name: Resolve image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            value="$INPUT_TAG"
          else
            value="$REF_NAME"
          fi
          if ! [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "invalid image tag: $value" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          # Only a plain release (vX.Y.Z) moves :latest; rc/beta/dev tags never do.
          if [[ "$value" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (labels, annotations)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.tag.outputs.release == 'true' }}
            type=raw,value=${{ steps.tag.outputs.value }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # Push per-arch digest — merged into a multi-arch manifest in the next job
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_TAG=${{ steps.tag.outputs.value }}
          # Build provenance and SBOM attestations attached to the image.
          provenance: mode=max
          sbom: true
          # Read access to the private JupiterMetaLabs Go modules (see Dockerfile).
          secrets: |
            go_modules_token=${{ secrets.GO_MODULES_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.runner_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner_arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner_arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge per-arch digests into a single multi-arch manifest ──
  merge-manifest:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Inputs reach the shell through env, never by template interpolation
      # into the script, and must look like an image tag.
      - name: Resolve image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            value="$INPUT_TAG"
          else
            value="$REF_NAME"
          fi
          if ! [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "invalid image tag: $value" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          # Only a plain release (vX.Y.Z) moves :latest; rc/beta/dev tags never do.
          if [[ "$value" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.tag.outputs.value }}
          RELEASE: ${{ steps.tag.outputs.release }}
        run: |
          # Build the list of per-arch digest references
          DIGESTS=$(ls /tmp/digests | sed "s|^|${IMAGE}@sha256:|" | tr '\n' ' ')

          TAGS=(--tag "${IMAGE}:${TAG}")
          if [ "$RELEASE" = "true" ]; then
            TAGS+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" $DIGESTS

      - name: Inspect final manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.tag.outputs.value }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"
