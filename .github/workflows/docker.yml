name: Docker

# Triggers on version tags (v2.0.0, v2.0.1-rc1, etc.)
# Also allows manual dispatch for testing
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for a test build (e.g. dev-mybranch). Version tags come from pushing the git tag."
        required: true
        default: "dev"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jupitermetalabs/jmdn

jobs:
  # ── Gate: nothing is published unless the tagged commit builds and passes
  # the unit tests. Mirrors the CI quality gate's build + test steps.
  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # actions/checkout writes GITHUB_TOKEN into .git/config by default,
          # leaving it readable by every later step. Nothing here needs it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch Go modules (token visible to this step only)
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          # go.mod requires two private repos - ThebeDB and avc. Without this
          # token the run does not fail here; it dies two steps later inside
          # `go mod verify` with "could not read Username for
          # 'https://github.com'", which reads as a network fault rather than a
          # missing secret. Fail at the step that owns the condition, with a
          # message that names it. Forks are never given secrets, so a fork PR
          # stops here by design.
          if [ -z "$GO_MODULES_TOKEN" ]; then
            echo "::error::GO_MODULES_TOKEN is not set. go.mod requires the private modules github.com/JupiterMetaLabs/ThebeDB and github.com/JupiterMetaLabs/avc. Set it under Settings -> Secrets and variables -> Actions (the other four JupiterMetaLabs modules are public and need no token)."
            exit 1
          fi
          echo "GOPRIVATE=github.com/JupiterMetaLabs/*" >> "$GITHUB_ENV"
          export GOPRIVATE="github.com/JupiterMetaLabs/*"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${GO_MODULES_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -short -race ./...

  build-and-push:
    name: Build & Push (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── linux/amd64 ──────────────────────────────────────
          # Linux (x86_64), Windows (Docker Desktop / WSL2)
          - platform: linux/amd64
            runner_arch: amd64

          # ── linux/arm64 ──────────────────────────────────────
          # macOS Apple Silicon (M1/M2/M3), Raspberry Pi 4/5,
          # modern ARM SBCs (Rock Pi, Orange Pi 5, etc.)
          - platform: linux/arm64
            runner_arch: arm64


    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # actions/checkout writes GITHUB_TOKEN into .git/config by default,
          # leaving it readable by every later step. Nothing here needs it.
          persist-credentials: false

      - name: Set up QEMU (cross-compilation for non-native arches)
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Inputs reach the shell through env, never by template interpolation
      # into the script, and must look like an image tag.
      - name: Resolve image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            value="$INPUT_TAG"
          else
            value="$REF_NAME"
          fi
          if ! [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "invalid image tag: $value" >&2
            exit 1
          fi
          # Version tags (v2.0.0, v2.0.1-rc1) come only from pushing the git
          # tag. A manual run can start from any branch, so it may not publish
          # under a version name or move :latest.
          if [ "$EVENT_NAME" != "push" ] && [[ "$value" =~ ^[vV][0-9] ]]; then
            echo "::error::version tags are published by pushing the git tag, not by a manual run: $value" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          # Only a plain release (vX.Y.Z) pushed as a git tag moves :latest;
          # rc/beta/dev tags never do.
          if [ "$EVENT_NAME" = "push" ] && [[ "$value" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (labels, annotations)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.tag.outputs.release == 'true' }}
            type=raw,value=${{ steps.tag.outputs.value }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # Push per-arch digest — merged into a multi-arch manifest in the next job
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_TAG=${{ steps.tag.outputs.value }}
          # Build provenance and SBOM attestations attached to the image.
          provenance: mode=max
          sbom: true
          # Read access to the private JupiterMetaLabs Go modules (see Dockerfile).
          secrets: |
            go_modules_token=${{ secrets.GO_MODULES_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.runner_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner_arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.runner_arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Scan every per-arch image BEFORE any tag points at it ────────────────────
  #
  # Order is the whole point. build-and-push pushes by DIGEST only — no tag
  # exists yet, so nothing is reachable by name. This job scans each of those
  # digests, and merge-manifest does not run unless it passes. A vulnerable
  # build therefore never becomes :vX.Y.Z and never becomes :latest.
  #
  # The earlier shape scanned AFTER merge-manifest, which was too late: that job
  # tags :latest on a plain release, so `latest` had already moved to an
  # unscanned image by the time the scan ran, and failing afterwards could not
  # take it back.
  #
  # Scanned BY DIGEST, not by tag, so the bytes scanned are exactly the bytes
  # merge-manifest will point a tag at — it builds the same `IMAGE@sha256:<hex>`
  # references from the same artifacts.
  #
  # One leg per platform, mirroring build-and-push. --platform is required, not
  # cosmetic: both legs build on an amd64 runner under QEMU, and buildx pushes
  # an index (provenance + SBOM attestations ride along), so without it Trivy
  # resolves the arm64 index to the runner's own platform and scans the wrong
  # thing — or nothing.
  scan-digests:
    name: Scan Image (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    strategy:
      # Report both arches in one run; a HIGH on arm64 should not hide amd64.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner_arch: amd64
          - platform: linux/arm64
            runner_arch: arm64

    steps:
      - name: Download digest
        uses: actions/download-artifact@v8.0.2
        with:
          name: digest-${{ matrix.runner_arch }}
          path: /tmp/digests

      # The artifact holds exactly one empty file named for the digest. Assert
      # that rather than globbing blindly: scanning the wrong digest, or
      # silently scanning none, is the failure this job exists to prevent.
      - name: Resolve image reference
        id: ref
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find /tmp/digests -type f)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly one digest file, found ${#files[@]}"
            exit 1
          fi
          digest=$(basename "${files[0]}")
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::not a sha256 digest: $digest"
            exit 1
          fi
          echo "value=${IMAGE}@sha256:${digest}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # setup-trivy, not trivy-action: this job runs Trivy twice over one image
      # and needs the --platform flag, which trivy-action does not expose. It is
      # the same action trivy-action installs with, and it is in actions.lock.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.76.2

      # Machine-readable report FIRST, with --exit-code 0, so the artifact
      # exists whatever the gate below decides and a failure can be triaged
      # without re-running the scan.
      - name: Scan report (sarif)
        env:
          REF: ${{ steps.ref.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.runner_arch }}
        run: |
          trivy image --platform "$PLATFORM" \
                      --severity HIGH,CRITICAL --ignore-unfixed \
                      --exit-code 0 --format sarif \
                      --output "trivy-image-${ARCH}.sarif" "$REF"

      - name: Upload scan report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trivy-image-${{ matrix.runner_arch }}-sarif
          path: trivy-image-${{ matrix.runner_arch }}.sarif
          if-no-files-found: error

      # THE GATE. Cache is warm from the step above, so this re-reads rather
      # than re-pulls. ignore-unfixed: only vulnerabilities with a published fix
      # hold a release — blocking on an unfixable CVE resolves nothing.
      - name: Scan (blocking)
        env:
          REF: ${{ steps.ref.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          trivy image --platform "$PLATFORM" \
                      --severity HIGH,CRITICAL --ignore-unfixed \
                      --exit-code 1 --format table "$REF"

  # ── Merge per-arch digests into a single multi-arch manifest ──
  merge-manifest:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-24.04
    # Gated on scan-digests: no tag — including :latest — is created until every
    # per-arch image has passed.
    needs: scan-digests
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Inputs reach the shell through env, never by template interpolation
      # into the script, and must look like an image tag.
      - name: Resolve image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            value="$INPUT_TAG"
          else
            value="$REF_NAME"
          fi
          if ! [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "invalid image tag: $value" >&2
            exit 1
          fi
          # Version tags (v2.0.0, v2.0.1-rc1) come only from pushing the git
          # tag. A manual run can start from any branch, so it may not publish
          # under a version name or move :latest.
          if [ "$EVENT_NAME" != "push" ] && [[ "$value" =~ ^[vV][0-9] ]]; then
            echo "::error::version tags are published by pushing the git tag, not by a manual run: $value" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          # Only a plain release (vX.Y.Z) pushed as a git tag moves :latest;
          # rc/beta/dev tags never do.
          if [ "$EVENT_NAME" = "push" ] && [[ "$value" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.tag.outputs.value }}
          RELEASE: ${{ steps.tag.outputs.release }}
        run: |
          # Build the list of per-arch digest references
          DIGESTS=$(ls /tmp/digests | sed "s|^|${IMAGE}@sha256:|" | tr '\n' ' ')

          TAGS=(--tag "${IMAGE}:${TAG}")
          if [ "$RELEASE" = "true" ]; then
            TAGS+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" $DIGESTS

      - name: Inspect final manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.tag.outputs.value }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"

