name: Gitleaks

on:
  push:
    branches: ["main", "v3base", "release/**"]
  pull_request:
    branches: ["main", "v3base", "release/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read the commit list of a pull request.
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The action scans the pushed or PR commit range, which a shallow
          # clone does not contain.
          fetch-depth: 0

      # Pull requests and pushes scan their own commits; a manual run scans
      # the whole history. Blocking: any finding fails the job.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Required for repositories owned by an organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # PR comments would need pull-requests: write.
          GITLEAKS_ENABLE_COMMENTS: "false"
