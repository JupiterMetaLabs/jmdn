# JMDN Node Configuration — TESTNET profile
# Place at ./jmdn.yaml or /etc/jmdn/jmdn.yaml
#
# Identical to jmdn_default.yaml (mainnet) except chain_id 8000800 and
# network.environment: testnet. With testnet the production safety locks are
# OFF: fail-open consensus flags and unauthenticated public services are only
# warned about at boot. Set security.strict_posture: true to enforce them here
# too.
# Env vars override with JMDN_ prefix (e.g. JMDN_NETWORK_CHAIN_ID=8000800)

# ── Node Identity ────────────────────────────────────────
node:
  alias: ""

# ── Networking ───────────────────────────────────────────
network:
  chain_id: 8000800           # testnet
  environment: testnet
  seednode: ""                # REQUIRED: seed node address (host:port)
  mempool: ""
  yggdrasil: true
  heartbeat_interval: 10  # seconds

# ── Ports ────────────────────────────────────────────────
ports:
  api: 0           # Disabled by default (use -api 8090 to enable)
  blockgen: 0      # Disabled by default (use -blockgen 15050 to enable)
  blockgrpc: 0     # Disabled by default (use -blockgrpc 15055 to enable)
  cli: 0
  did: 15052
  facade: 8545
  thebe_debug: 19090
  ws: 8546
  metrics: 0       # Disabled by default (use -metrics 8081 to enable)
  profiler: 0      # Disabled by default (use -profiler 6060 to enable)

binds:
  api: "127.0.0.1"
  blockgen: "127.0.0.1"  # Admin - Block generation
  blockgrpc: "127.0.0.1"   # P2P - Block propagation
  cli: "127.0.0.1"       # Admin - CLI control
  did: "0.0.0.0"
  facade: "0.0.0.0"
  thebe_debug: "127.0.0.1"
  ws: "0.0.0.0"
  metrics: "127.0.0.1"
  profiler: "127.0.0.1"  # Debugging - STRICTLY LOCALHOST

# ── Database ─────────────────────────────────────────────
# ThebeDB is embedded (BadgerDB KV + SQL projection) — no address/credentials.
# redis: account sync worker queue.
database:
  redis:
    url: "127.0.0.1:6379"
    password: ""

# ── ThebeDB ──────────────────────────────────────────────
thebe:
  enabled: true                # ThebeDB is the node's only storage backend
  kv_path: "./storage/thebe-kv"
  # SEC-04: sslmode=require (no cleartext SQL). Postgres must have TLS enabled;
  # for a non-TLS local DB, override THEBE_SQL_DSN with sslmode=disable.
  sql_dsn: "postgres://jmdn:jmdndefault@127.0.0.1:5430/jmdn?sslmode=require"  # Env: THEBE_SQL_DSN
  redis_url: ""                # Env: THEBE_REDIS_URL
  stream_name: "thebedb.events" # Env: THEBE_STREAM_NAME
  max_len: 1000                # Env: THEBE_MAX_LEN
  group_name: "projector"      # Env: THEBE_GROUP_NAME
  cdc:
    # Off by default. CDC copies every Postgres row change (including each
    # block's ZK proof, hex-encoded at ~2x its size) into a DuckDB event log
    # and holds a replication slot. Turn it on only on a node that consumes
    # the event log. Turning it off later does NOT drop the slot; jmdn warns
    # at boot if one is left behind. To enable: run
    # Scripts/setup_postgres.sh --with-cdc, then set this to true.
    enabled: false
    slot_name: thebe_eventlog
    publication: thebe_pub
    log_path: ./data/eventlog.duckdb
    dlq_path: ./data/dlq/DLQ.log
    max_lag_bytes: 104857600            # 100MB lag alert threshold

# ── Logging (Ion) ────────────────────────────────────────
# Maps directly to Ion's config struct. All env vars like
# OTEL_EXPORTER_OTLP_ENDPOINT are replaced by this section.
logging:
  level: "warn"              # debug, info, warn, error
  development: false
  service_name: "jmdn"

  console:
    enabled: true
    format: "systemd"        # json, pretty, systemd
    color: true
    errors_to_stderr: true

  file:
    enabled: false
    path: ""
    max_size_mb: 100
    max_age_days: 7
    max_backups: 5
    compress: true

  otel:
    enabled: false
    endpoint: ""             # e.g. "collector.example.com:4317"
    protocol: "grpc"
    insecure: false
    headers: {}              # e.g. {"Authorization": "Bearer <token>"}
    username: ""             # Prefer env: JMDN_LOGGING_OTEL_USERNAME
    password: ""             # Prefer env: JMDN_LOGGING_OTEL_PASSWORD
    batch_size: 512
    export_interval: "5s"

  tracing:
    enabled: false
    sampler: "ratio:0.2"        # always, never, ratio:0.5

# ── Features ────────────────────────────────────────────
features:
  use_legacy_bft: false
  grotrack: false            # Requires ports.metrics > 0

# ── FastSync V2 ─────────────────────────────────────────
fastsync:
  enabled: false            # DISABLED pending ThebeDB FastSync redesign — re-enable when the new engine ships
  enable_pulling: true    # Allow this node to pull data from peers and write to its DB.
                          # Set false on sequencers — they are authoritative and must
                          # never overwrite their own state (they still serve data).
  enable_catchup: true    # Wire SyncMonitor reconciliation — auto-catchup when the
                          # seednode reports this node is out of sync.
                          # MUST be false on the sequencer — it is authoritative and
                          # must never pull state from peers to overwrite its own chain.
  sync_timeout: 10m       # Max wall-clock time for a single full sync operation.
  sync_check_interval: 10m # How often to report Merkle root to seednode. Min: 1m.
  catch_up_from_block: 0  # First block AFTER your bootstrap snapshot (bootstrapTip+1).
                          # 0 = full scan from genesis (safe default, no bootstrap loaded).
                          # Set to bootstrapTip+1 after bootstrap to avoid rescanning
                          # the already-complete bootstrap range on every catchup.

# ── Consensus feature flags ─────────────────────────────
# YAML home for the rollout switches that used to be env-only. Precedence per
# key: legacy env var (if SET, with its original parser) > this file > default.
# Defaults are the historical env defaults, except committee_v2 and agg_cert
# which default ON to match the testnet fleet (every node sets them; they must
# be ON together fleet-wide). Leaving this section out = fleet posture. Consensus-critical flags must be identical fleet-wide —
# coordinate every flip. The effective values are printed once at boot
# ("consensus flags (env > yaml > default): ...").
#
# Legacy env parsers (apply only when the env var is set):
#   lenient   unset→default; 0/false/no/off→off; anything else→on
#   exactly-1 "1"→on; anything else (even "true")→off
#   not-0     "0"→off; anything else (even "false")→on
consensus:
  # REQUIRED: the seed authority dela/bls public key (hex), distributed out of
  # band. Pins the committee snapshot signer; the sequencer peer ID is learned
  # from the same signed snapshot once the seed signs it.
  seed_authority_bls_pub: ""
  # Optional: pin the sequencer peer ID explicitly (wins over the seed value).
  sequencer_pinned_peer_id: ""
  # Stage 2 (RANDAO+VDF beacon) has no rule switches: reveals are BLS and the VDF
  # has one valid output per input, always. It requires
  # committee_anchor_activation_height and refuses to install without it.
  flags:
    committee_snapshot_anchor: false        # JMDN_COMMITTEE_SNAPSHOT_ANCHOR (lenient). Older hash-only anchor; unwired.
    committee_v2: true                      # JMDN_COMMITTEE_V2 (lenient). Authenticated committee snapshots. Fleet-wide ON.
    reject_legacy_votes: true               # JMDN_REJECT_LEGACY_VOTES (lenient). Production posture locks this ON.
    enforce_committee_registry: true        # JMDN_ENFORCE_COMMITTEE_REGISTRY (lenient). Production posture locks this ON.
    enforce_block_linkage: true             # JMDN_ENFORCE_BLOCK_LINKAGE (lenient). Parent/height contiguity on receive.
    enforce_body_binding: true              # JMDN_ENFORCE_BODY_BINDING (lenient). Production posture locks this ON.
    agg_cert: true                          # JMDN_AVC_AGG_CERT (exactly-1). Aggregate BLS certificates. Fleet-wide ON.
    timeout_cert_wiring: false              # JMDN_TIMEOUT_CERT_WIRING (lenient). Timeout-certificate gossip.
    timeout_cert_rejoin: false              # JMDN_TIMEOUT_CERT_REJOIN (exactly-1). Rejoin via timeout certificates.
    enforce_slot_recovery_gate: true        # JMDN_ENFORCE_SLOT_RECOVERY_GATE (not-0). Applies to BOTH readers (messaging + vote path).
    enforce_sync_gate: true                 # JMDN_ENFORCE_SYNC_GATE (not-0). A validator behind the head abstains.
                                            # Devnet genesis bootstrap sets this false; re-enable once blocks flow.
    emit_block_bound_votes: true            # JMDN_EMIT_BLOCK_BOUND_VOTES (not-0). Block-bound BLS vote domain.
    validator_voter_set: true               # JMDN_VALIDATOR_VOTER_SET (lenient).
    validator_vote_ingest: true             # JMDN_VALIDATOR_VOTE_INGEST (lenient).
    emit_committee_bls: true                # JMDN_EMIT_COMMITTEE_BLS (not-0). Seed signs committee snapshots.
    allow_new_receiver_accounts: true       # JMDN_ALLOW_NEW_RECEIVER_ACCOUNTS (lenient). Create unknown receivers at apply.
    block_gossip: true                      # JMDN_BLOCK_GOSSIP (lenient). Block propagation over gossipsub.
    finalize_cert_only: false               # JMDN_FINALIZE_CERT_ONLY (lenient). Committee receives header+certificate at finalize instead of the full block (it already holds the proposal). Enable only once every validator runs a build with this flag.
    trust_sequencer_certificate: false     # JMDN_TRUST_SEQUENCER_CERT (lenient). Accept a received block below 2f+1 when >= f+1 eligible votes verify. Testnet stopgap only; refused under production posture.
    vote_crdt_compact_k: 3                  # JMDN_VOTE_CRDT_COMPACT_K (uint). Rounds kept behind tip; floored at 2.

# ── Reputation (observe-only) ───────────────────────────
reputation:
  observe: true                 # JMDN_REPUTATION_OBSERVE (lenient). Score peers; never feeds the quorum tally.
  push_interval_seconds: 300    # JMDN_REPUTATION_PUSH_INTERVAL_SECONDS. 0 = never push scores to the seednode.
  push_suspend: true            # JMDN_REPUTATION_PUSH_SUSPEND (not-0). Suspend pushes while self-faulted (D-61).
  store_path: ""                # JMDN_REPUTATION_STORE_PATH. Durable score file; empty = in-memory only.

# ── Security ────────────────────────────────────────────
# Enterprise Security Module (Gatekeeper)
# Prefer env vars for secrets: JMDN_SECURITY_EXPLORER_API_KEY, JMDN_SECURITY_JWT_SECRET
security:
  enabled: true
  cert_dir: "certs"
  ip_cache_size: 10000

  # Layer 1: Aggregate per-IP rate limit across all services (DDoS defense).
  # The public JSON-RPC is unauthenticated by design, so this is its abuse
  # control; 0 disables it and fails the production security posture check.
  global_rate_limit: 50
  global_burst: 100

  # Cloud Native / Load Balancer Support
  trust_forwarded_headers: true   # Enable for Cloudflare/GCP LB
  trusted_proxies: []             # Optional: ["10.0.0.0/8"]

  # Trusted Clients — IPs/CIDRs that bypass rate limiting entirely.
  # For co-located services (orchestrator) and VPC-internal node peers.
  # Does NOT bypass authentication — only rate limiting.
  # Distinct from trusted_proxies (which controls header trust).
  trusted_clients: []             # e.g. ["127.0.0.1", "::1", "10.128.0.0/16"]

  # Legacy Secrets (Moved here for unification)
  explorer_api_key: ""
  jwt_secret: ""

  # Service Policies (Granular Control)
  services:
    # 1. Explorer API (Public - Secure - Hybrid Auth)
    explorer_api:
      tls: true             # User req: "must be true"
      auth_type: "hybrid"   # Prefer mTLS, fallback to Token
      token_env: "EXPLORER_API_KEY"
      rate_limit: 0
      burst: 0

    # 2. JSON-RPC (Public - Rate Limited)
    eth_rpc:
      tls: false            # Public endpoint
      auth_type: "none"
      rate_limit: 20        # per IP, req/s
      burst: 40

    # 3. Block Ingest/Sequencer (Internal - Token Auth)
    block_ingest_http:
      tls: false
      auth_type: "token"
      token_env: "SEQUENCER_TOKEN"
      rate_limit: 0
      burst: 0

    # 4. Validator P2P (Internal/Critical - Strict mTLS)
    block_ingest_grpc:
      tls: true
      auth_type: "mtls"     # Zero Trust - mTLS ONLY
      rate_limit: 0
      burst: 0

    # 5. CLI Admin (Localhost - Strict mTLS)
    cli_admin:
      tls: true
      auth_type: "mtls"
      rate_limit: 0
      burst: 0

    # 6. DID Service (Public - Hybrid)
    did_service:
      tls: true
      auth_type: "hybrid"
      token_env: "DID_AUTH_TOKEN"
      rate_limit: 0
      burst: 0

    # 7. Mempool (P2P - Standard TLS)
    mempool_service:
      tls: true             # "At least standard TLS"
      auth_type: "none"
      rate_limit: 0
      burst: 0

    # 8. gETH gRPC (Internal - Sensitive - mTLS)
    eth_grpc:
      tls: true
      auth_type: "mtls"     # "Definitely mTLS"
      rate_limit: 0
      burst: 0

    # 8. BFT Buddy (Internal - mTLS, NO rate limit to avoid liveness risk)
    bft_buddy:
      tls: true
      auth_type: "mtls"
      rate_limit: 0         # NEVER rate-limit BFT consensus
      burst: 0

    # 9. BFT Sequencer (Internal - mTLS, NO rate limit)
    bft_sequencer:
      tls: true
      auth_type: "mtls"
      rate_limit: 0         # NEVER rate-limit BFT consensus
      burst: 0

# ── Alerts ─────────────────────────────────────────────
# External alerting service (Telegram via tg.jmdt.io).
# Prefer env vars for secrets: JMDN_ALERTS_API_KEY, JMDN_ALERTS_CHAT_ID
alerts:
  url: ""                    # e.g. "https://tg.jmdt.io/multi-channel"
  api_key: ""                # Prefer env: JMDN_ALERTS_API_KEY
  chat_id: ""                # Prefer env: JMDN_ALERTS_CHAT_ID
  http_timeout: 10s

# ── Transaction status ─────────────────────────────────
# Answers "where is this transaction?" for hashes that are not in a block, by
# consulting the mempool routing engine and a local record of what this node
# forwarded. Powers the non-standard jmdt_getTransactionStatus method.
#
# DEFAULT-OFF. While disabled: no submit records are kept,
# jmdt_getTransactionStatus reports the method as unavailable, and
# eth_getTransactionByHash behaves exactly as it does today.
#
# eth_getTransactionReceipt is NEVER affected by anything here. A receipt stays
# null until the transaction is in a block, because wallets read a non-null
# receipt as proof of mining — a synthesised receipt with status 0x0 would show
# a merely-queued transaction as FAILED.
#
# Requires MRE_LOOKUP_ENABLED=true on the mempool routing engine; without it
# every mempool lookup returns UNIMPLEMENTED and statuses degrade to `unknown`.
tx_status:
  enabled: false                      # JMDN_TX_STATUS_ENABLED

  # How long this node remembers that it forwarded a transaction. This is the
  # ONLY evidence that permits a `processing` answer, so it must comfortably
  # exceed the worst-case time-to-inclusion. MEASURE that on your network
  # first: the sequencer polls the mempool on an interval and only builds a
  # block once enough transactions are pending, so it is far longer than
  # intuition suggests. Too short and in-flight transactions report `unknown`.
  submit_record_ttl: 30m               # JMDN_TX_STATUS_SUBMIT_RECORD_TTL
  submit_record_capacity: 100000       # JMDN_TX_STATUS_SUBMIT_RECORD_CAPACITY

  # Ceiling on how long a status query may wait on the mempool. Expiry degrades
  # the answer to `unknown`; it never hangs or errors the RPC.
  mempool_timeout: 400ms               # JMDN_TX_STATUS_MEMPOOL_TIMEOUT
  chain_timeout: 2s                    # JMDN_TX_STATUS_CHAIN_TIMEOUT

  # Remembers CONCLUSIVE unknowns so repeated probes for nonexistent hashes do
  # not each trigger a fleet-wide fan-out. Inconclusive answers are never
  # cached. Keep the TTL short — it bounds how long a freshly submitted
  # transaction can stay invisible after a miss on the same hash.
  negative_cache_ttl: 2s               # JMDN_TX_STATUS_NEGATIVE_CACHE_TTL
  negative_cache_size: 16384           # JMDN_TX_STATUS_NEGATIVE_CACHE_SIZE

  # Load protection, not tuning: the JSON-RPC port is public and every
  # chain-store miss amplifies into an N-shard scatter-gather inside MRE.
  # There is no transport auth between jmdn and MRE today, so do not raise
  # these or set them to 0.
  rate_limit_per_sec: 50               # JMDN_TX_STATUS_RATE_LIMIT_PER_SEC
  rate_limit_burst: 100                # JMDN_TX_STATUS_RATE_LIMIT_BURST

  # Stops calling an unresponsive mempool, so an outage does not add the full
  # timeout to every request.
  breaker_failure_threshold: 5         # JMDN_TX_STATUS_BREAKER_FAILURE_THRESHOLD
  breaker_cooldown: 5s                 # JMDN_TX_STATUS_BREAKER_COOLDOWN

  # Second, separate opt-in: lets eth_getTransactionByHash answer from the
  # mempool, returning a queued transaction with null blockHash / blockNumber /
  # transactionIndex (the standard Ethereum pending representation), and null
  # for a hash that is not known anywhere. Off even when `enabled` is true,
  # because it changes what existing clients see.
  pending_tx_by_hash: false            # JMDN_TX_STATUS_PENDING_TX_BY_HASH
